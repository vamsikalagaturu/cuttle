name: Release
# Pushing a tag vX.Y.Z releases that version: a draft release is made with CHANGELOG.md's "## [X.Y.Z]" section as its
# notes, the packages are built from the tag and attached, and the release is published once all of them are there,
# so the updater never sees a release without its files. The libraries come from the caches ci.yml fills on main
# (same keys); on a miss build.sh builds them through deps.sh.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  # the plain version number; any other build is marked as a development one (CMakeLists.txt)
  PT_RELEASE: "1"
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draft the release with its CHANGELOG.md section as notes
        run: |
          version=${TAG#v}
          notes="$RUNNER_TEMP/notes.md"
          awk -v head="## [$version]" '
            /^## \[/ { if (on) exit; on = index($0, head) == 1; next }
            on' CHANGELOG.md | sed -e '/./,$!d' >"$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error file=CHANGELOG.md::no notes under a '## [$version]' heading"
            exit 1
          fi
          printf '\nInstall and update as described in the [README](https://github.com/%s#install); 0.6.0 and later update themselves (Menu > About cuttle > Check for updates).\n' \
            "$GITHUB_REPOSITORY" >>"$notes"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "cuttle $version" \
            --notes-file "$notes"
  publish:
    needs: [linux, android, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
  linux:
    needs: notes
    # the oldest supported Ubuntu (24.04 and later, Arch): the binary needs the glibc it was built with or newer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # before the packages are installed, as in ci.yml, so both compute the same key
      - name: Cache key (runner image, compiler, pinned versions, deps.sh)
        id: key
        run: |
          cc_version=$(cc --version)
          cc_version=${cc_version%%$'\n'*}
          echo "key=deps-linux-$ImageOS-${cc_version//[^A-Za-z0-9.-]/_}-${PT_FONTS:-slim}-${{ hashFiles('platform/versions.sh', 'platform/linux/deps.sh') }}" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: |
            ${{ runner.temp }}/cuttle-linux/dl
            ${{ runner.temp }}/cuttle-linux/src
            ${{ runner.temp }}/cuttle-linux/mupdf-build-*
            ${{ runner.temp }}/cuttle-linux/openssl-install-*
            ${{ runner.temp }}/cuttle-linux/raylib-install-*
      - name: Compilers, pkg-config, fontconfig, raylib's X11/Wayland/GL headers
        # without man-db's index rebuild, which can hang the install for many minutes on these runners
        timeout-minutes: 10
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libfontconfig-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libegl-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols
      - name: Build, test and pack the AppImage and tarball (platform/linux/build.sh)
        run: PT_LINUX_OUT="$RUNNER_TEMP/cuttle-linux" platform/linux/build.sh
      - name: Attach them to the release
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RUNNER_TEMP/cuttle-linux/out/cuttle-x86_64.AppImage" \
            "$RUNNER_TEMP/cuttle-linux/out/cuttle-linux-x86_64.tar.gz"
  android:
    needs: notes
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
      # every release is signed with the same key, so an update installs over the previous version; outside the
      # cached and uploaded folders
      - name: Release signing key (secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are not set (platform/android/README.md)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/cuttle-release.jks"
      - name: Ninja, Android build-tools, platform and NDK
        timeout-minutes: 15
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y ninja-build zip
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.1.0" "platforms;android-36.1" \
            "ndk;$NDK_VERSION" >/dev/null
      - name: Cache key (runner image, NDK, pinned versions, deps.sh)
        id: key
        run: |
          echo "key=deps-android-$ImageOS-ndk$NDK_VERSION-${PT_FONTS:-slim}-${{ hashFiles('platform/versions.sh', 'platform/android/deps.sh') }}" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: |
            ${{ runner.temp }}/cuttle-android/dl
            ${{ runner.temp }}/cuttle-android/src
            ${{ runner.temp }}/cuttle-android/mupdf-build-*
            ${{ runner.temp }}/cuttle-android/openssl-install-*
      - name: Build the APK (platform/android/build.sh)
        env:
          PT_ANDROID_KEYSTORE: ${{ runner.temp }}/cuttle-release.jks
          PT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          PT_ANDROID_OUT="$RUNNER_TEMP/cuttle-android" ANDROID_NDK="$ANDROID_HOME/ndk/$NDK_VERSION" \
            platform/android/build.sh
      - name: Attach it to the release
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RUNNER_TEMP/cuttle-android/out/cuttle.apk"
  macos:
    needs: notes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache key (runner image, compiler, pinned versions, deps.sh)
        id: key
        run: |
          cc_version=$(cc --version)
          cc_version=${cc_version%%$'\n'*}
          echo "key=deps-macos-$ImageOS-${cc_version//[^A-Za-z0-9.-]/_}-${PT_FONTS:-slim}-${{ hashFiles('platform/versions.sh', 'platform/macos/deps.sh') }}" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: |
            ${{ runner.temp }}/cuttle-macos/dl
            ${{ runner.temp }}/cuttle-macos/src
            ${{ runner.temp }}/cuttle-macos/mupdf-build-*
            ${{ runner.temp }}/cuttle-macos/openssl-install-*
            ${{ runner.temp }}/cuttle-macos/raylib-install-*
      - name: Build, test and pack cuttle.app and cuttle.dmg (platform/macos/build.sh)
        run: PT_MACOS_OUT="$RUNNER_TEMP/cuttle-macos" platform/macos/build.sh
      - name: Attach it to the release
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RUNNER_TEMP/cuttle-macos/out/cuttle.dmg"
  windows:
    needs: notes
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed (bash scripts break on CRLF)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Cache key (runner image, MSVC, pinned versions, deps.sh)
        id: key
        # the MSVC version vcvars64.bat selects, as deps.sh finds Visual Studio
        run: |
          vs=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' \
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | tr -d '\r')
          msvc=$(tr -d '\r\n' <"$(cygpath -u "$vs")/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt")
          echo "key=deps-windows-$ImageOS-msvc$msvc-${PT_FONTS:-slim}-${{ hashFiles('platform/versions.sh', 'platform/windows/deps.sh') }}" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          key: ${{ steps.key.outputs.key }}
          # MuPDF builds inside its source tree (src/mupdf-<fonts>), so src holds its build too
          path: |
            ${{ runner.temp }}/cuttle-windows/dl
            ${{ runner.temp }}/cuttle-windows/src
            ${{ runner.temp }}/cuttle-windows/openssl-install
            ${{ runner.temp }}/cuttle-windows/raylib-install
      - name: Build, test and pack cuttle-windows.zip (platform/windows/build.sh, MSVC)
        run: PT_WINDOWS_OUT="$(cygpath -u "$RUNNER_TEMP")/cuttle-windows" platform/windows/build.sh
      - name: Attach it to the release
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$(cygpath -w "$RUNNER_TEMP")\\cuttle-windows\\out\\cuttle-windows.zip"
